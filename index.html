<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kairos Time Entry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="login-container">
        <div class="header-section">
            <div class="logo-container">
                <div class="logo-box"><span class="twc-text">TWC</span></div>
                <div class="company-name">TIONG WOON CORPORATION HOLDING LTD.</div>
            </div>
            <div class="welcome-text">
                <span class="sub-title">KAIROS TIME ENTRY</span>
                <h1>Welcome</h1>
                <h1 class="red-text">Back.</h1>
            </div>
            <div class="red-line"></div>
        </div>
        <div class="form-section">
            <div class="env-selector" id="envSelector">
                <div class="env-pill active" data-env="third"
                    style="background:linear-gradient(135deg,#C6152A,#A00F21);">THIRD</div>
                <div class="env-pill" data-env="pilot">PILOT</div>
                <div class="env-pill" data-env="production">PRODUCTION</div>
            </div>
            <span class="form-title">SIGN IN TO CONTINUE</span>
            <form id="loginForm">
                <div class="input-group">
                    <i data-lucide="briefcase"></i>
                    <input type="text" value="01074115" placeholder="Username">
                </div>
                <div class="input-group">
                    <i data-lucide="lock"></i>
                    <input type="password" id="passwordInput" value="123456" placeholder="Password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <i data-lucide="eye-off" id="eyeIcon"></i>
                    </button>
                </div>
                <button type="submit" class="login-button">LOGIN</button>
            </form>
            <div class="custom-server-toggle" onclick="toggleCustomServer()">
                <i data-lucide="server"></i>
                <span>Use custom server</span>
                <i data-lucide="chevron-up" id="chevronIcon"></i>
            </div>
            <div class="server-url-box" id="serverBox">
                <i data-lucide="globe"></i>
                <input type="text" value="https://cloud2.kairossolutions.co/kairostin" readonly>
            </div>
        </div>
        <div class="footer-section">
            <div class="device-id">Device ID: SKQ1.211103.001<i data-lucide="copy" class="copy-icon"></i></div>
            <div class="app-version">App Version: 1.0.27</div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        const envConfig = {
            third: { gradient: 'linear-gradient(135deg,#C6152A 0%,#A00F21 100%)', accentColor: '#C6152A', glowColor: 'rgba(198,21,42,0.2)', shadowColor: 'rgba(198,21,42,0.3)', serverUrl: 'https://cloud2.kairossolutions.co/kairostin' },
            pilot: { gradient: 'linear-gradient(135deg,#E07B20 0%,#C06010 100%)', accentColor: '#E07B20', glowColor: 'rgba(224,123,32,0.2)', shadowColor: 'rgba(224,123,32,0.3)', serverUrl: 'https://pilot.kairossolutions.co/kairostin' },
            production: { gradient: 'linear-gradient(135deg,#1A9A2A 0%,#14771F 100%)', accentColor: '#1A9A2A', glowColor: 'rgba(26,154,42,0.2)', shadowColor: 'rgba(26,154,42,0.3)', serverUrl: 'https://cloud.kairossolutions.co/kairostin' }
        };
        let currentEnv = localStorage.getItem('selectedEnv') || 'third';
        function applyEnv(env) {
            currentEnv = env; localStorage.setItem('selectedEnv', env);
            const cfg = envConfig[env];
            document.querySelectorAll('.env-pill').forEach(pill => {
                if (pill.dataset.env === env) { pill.classList.add('active'); pill.style.background = cfg.gradient; }
                else { pill.classList.remove('active'); pill.style.background = 'none'; }
            });
            const loginBtn = document.querySelector('.login-button');
            if (loginBtn) { loginBtn.style.background = cfg.gradient; loginBtn.style.boxShadow = '0 10px 20px ' + cfg.shadowColor; }
            const redLine = document.querySelector('.red-line');
            if (redLine) redLine.style.backgroundColor = cfg.accentColor;
            const redText = document.querySelector('.red-text');
            if (redText) redText.style.color = cfg.accentColor;
            const twcText = document.querySelector('.twc-text');
            if (twcText) twcText.style.color = cfg.accentColor;
            const serverInput = document.querySelector('.server-url-box input');
            if (serverInput) serverInput.value = cfg.serverUrl;
        }
        document.querySelectorAll('.env-pill').forEach(pill => pill.addEventListener('click', () => applyEnv(pill.dataset.env)));
        applyEnv(currentEnv);
    </script>
</body>

</html>
