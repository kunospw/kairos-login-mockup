<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job List - Kairos Time Entry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        a.job-card-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        a.job-card-link .job-card {
            cursor: pointer;
        }

        a.job-card-link .job-card:hover {
            transform: scale(0.99);
        }

        .dev-reset {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.6;
            z-index: 999;
            letter-spacing: 0.5px;
        }

        .dev-reset:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>

<body class="light-body">
    <div class="app-container">

        <!-- Top Toolbar -->
        <header class="toolbar">
            <div class="user-profile" id="userProfileBtn" style="cursor:pointer">
                <i data-lucide="circle-user"></i>
                <div class="user-info-text">
                    <span class="user-name">ARIF .</span>
                    <span class="user-id">01074115</span>
                </div>
            </div>
            <div class="toolbar-actions">
                <i data-lucide="lock" id="lockBtn" style="cursor:pointer"></i>
                <i data-lucide="log-out" onclick="location.href='index.html'" style="cursor:pointer"></i>
            </div>
        </header>

        <!-- Session Profile Modal -->
        <div class="modal-overlay" id="profileModal">
            <div class="modal-content profile-modal">
                <div class="modal-header">
                    <h3>Session Profile</h3>
                    <button class="close-modal" id="closeProfile"><i data-lucide="x"></i></button>
                </div>
                <div class="modal-body profile-data">
                    <div class="profile-item">
                        <i data-lucide="user" class="item-icon"></i>
                        <div class="item-text"><label>Employee Name</label><span>ARIF .</span></div>
                    </div>
                    <div class="profile-item">
                        <i data-lucide="id-card" class="item-icon"></i>
                        <div class="item-text"><label>Employee ID</label><span>01074115</span></div>
                    </div>
                    <div class="profile-item">
                        <i data-lucide="building-2" class="item-icon"></i>
                        <div class="item-text"><label>Company Name</label><span>[THIRD] TIONG WOON PROJECT & CONTRACTING
                                PTE. LTD.</span></div>
                    </div>
                    <div class="profile-item">
                        <i data-lucide="server" class="item-icon"></i>
                        <div class="item-text"><label>Active Tenant URL</label><span class="small-link"
                                id="tenantUrl"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PIN Modal -->
        <div class="modal-overlay" id="pinModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button class="close-modal" id="closePin"><i data-lucide="arrow-left"></i></button>
                        <h3 style="font-size:16px;">Set your new PIN</h3>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="pin-form">
                        <div class="input-group"><i data-lucide="lock"></i><input type="password"
                                placeholder="Enter current PIN"><button class="toggle-password"><i
                                    data-lucide="eye"></i></button></div>
                        <div class="input-group"><i data-lucide="lock"></i><input type="password"
                                placeholder="Enter 6 digit PIN"><button class="toggle-password"><i
                                    data-lucide="eye"></i></button></div>
                        <div class="input-group"><i data-lucide="lock"></i><input type="password"
                                placeholder="Confirm PIN"><button class="toggle-password"><i
                                    data-lucide="eye"></i></button></div>
                        <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                            <button class="save-btn" id="savePin">SAVE</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Job List -->
        <main class="job-list-container">
            <div class="date-navigator">
                <button class="nav-btn"><i data-lucide="chevron-left"></i></button>
                <div class="current-date">
                    <i data-lucide="calendar"></i>
                    <span id="currentDateDisplay">08-10-2025</span>
                </div>
                <button class="nav-btn"><i data-lucide="chevron-right"></i></button>
            </div>
            <div id="jobListContainer"></div>
        </main>
    </div>

    <!-- Dev Reset -->
    <button class="dev-reset" onclick="devReset()">↺ Reset DB</button>

    <script src="db.js"></script>
    <script src="env-theme.js"></script>
    <script>
        lucide.createIcons();

        /* ── Render Job List ── */
        function statusLabel(s) {
            if (s === 'new') return { text: 'New', cls: 'status-new', cardCls: 'status-new-card' };
            if (s === 'in-progress') return { text: 'In Progress', cls: 'status-in-progress', cardCls: 'status-progress-card' };
            if (s === 'completed') return { text: 'Complete', cls: 'status-complete', cardCls: 'status-complete-card' };
            return { text: s, cls: '', cardCls: '' };
        }

        function renderJobs() {
            const jobs = KairosDB.getJobs();
            const container = document.getElementById('jobListContainer');
            container.innerHTML = '';

            if (!jobs.length) {
                container.innerHTML = `<div class="empty-state"><i data-lucide="inbox"></i><p>No jobs assigned for this date.</p></div>`;
                lucide.createIcons();
                return;
            }

            jobs.forEach(job => {
                const s = statusLabel(job.status);
                const detailPage = job.status === 'completed' ? 'job-detail-complete.html' : 'job-detail.html';
                const el = document.createElement('a');
                el.className = 'job-card-link';
                el.href = `${detailPage}?jobId=${job.id}`;
                el.innerHTML = `
                <div class="job-card ${s.cardCls}">
                    <div class="card-left">
                        <div class="icon-circle"><i data-lucide="${job.icon}"></i></div>
                    </div>
                    <div class="card-right">
                        <div class="card-header">
                            <h3>${job.projectName}</h3>
                            <span class="job-card-status ${s.cls}">${s.text}</span>
                        </div>
                        <div class="card-details">
                            <span class="detail-item">#${job.jobNumber}</span>
                            <span class="detail-item">Type: ${job.type}</span>
                            <span class="detail-item">Emp: ${job.employee}</span>
                            <span class="detail-item">Op: ${job.operation}</span>
                        </div>
                        <div class="dates">
                            <i data-lucide="calendar" style="width:12px;height:12px;"></i>
                            ${job.startDateTime}
                        </div>
                    </div>
                </div>`;
                container.appendChild(el);
            });

            lucide.createIcons();
        }

        renderJobs();

        /* ── Modals ── */
        const profileModal = document.getElementById('profileModal');
        const pinModal = document.getElementById('pinModal');
        document.getElementById('userProfileBtn').addEventListener('click', () => profileModal.classList.add('show'));
        document.getElementById('closeProfile').addEventListener('click', () => profileModal.classList.remove('show'));
        document.getElementById('lockBtn').addEventListener('click', () => pinModal.classList.add('show'));
        document.getElementById('closePin').addEventListener('click', () => pinModal.classList.remove('show'));
        document.getElementById('savePin').addEventListener('click', () => { alert('PIN saved!'); pinModal.classList.remove('show'); });

        [profileModal, pinModal].forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.parentElement.querySelector('input');
                const icon = btn.querySelector('i');
                input.type = input.type === 'password' ? 'text' : 'password';
                icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
                lucide.createIcons();
            });
        });

        /* ── Tenant URL ── */
        const envUrls = { third: 'https://cloud2.kairossolutions.co/kairostin', pilot: 'https://pilot.kairossolutions.co/kairostin', production: 'https://cloud.kairossolutions.co/kairostin' };
        const env = localStorage.getItem('selectedEnv') || 'third';
        const tenantEl = document.getElementById('tenantUrl');
        if (tenantEl) tenantEl.textContent = envUrls[env] || envUrls.third;

        /* ── Dev Reset ── */
        function devReset() {
            if (confirm('Reset all job data to defaults?')) {
                KairosDB.resetAll();
                renderJobs();
            }
        }
    </script>
</body>

</html>
